name: Build ESP32-C6 OTBR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.3
    steps:
      - name: Clone Official Espressif Thread BR
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          git clone --recursive https://github.com
          cd esp-thread-br/examples/basic_thread_border_router
          idf.py set-target esp32c6
          idf.py build
          esptool.py --chip esp32c6 merge_bin -o /__w/merged-otbr-esp32c6.bin @build/flash_args

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32c6-standalone-otbr
          path: /__w/merged-otbr-esp32c6.bin
