name: Build ESP32-C6 OTBR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build and Merge Binary
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          find . -name "idf_component.yml" -exec sed -i '/path:/d' {} +
          idf.py set-target esp32c6
          idf.py build
          esptool --chip esp32c6 merge-bin -o merged-otbr-esp32c6.bin @build/flash_args

      - name: Upload Firmware
        uses: actions/upload-artifact@v5
        with:
          name: esp32c6-standalone-otbr
          path: merged-otbr-esp32c6.bin
