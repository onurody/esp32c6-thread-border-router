name: Build ESP32-C6 OTBR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.3
    steps:
      - uses: actions/checkout@v4
        with:
          repository: espressif/esp-thread-br
          submodules: recursive

      - name: Build ESP32-C6 Wi-Fi OTBR
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cd examples/basic_thread_border_router
          sed -i '/AUTO_UPDATE_RCP/d' sdkconfig.defaults || true
          cat << 'EOF' >> sdkconfig.defaults
          CONFIG_EXAMPLE_CONNECT_WIFI=y
          CONFIG_EXAMPLE_WIFI_SSID="ONUR-YILDIZ"
          CONFIG_EXAMPLE_WIFI_PASSWORD="5412000735"
          CONFIG_OPENTHREAD_BR_AUTO_START=y
          CONFIG_OPENTHREAD_RADIO_NATIVE=y
          CONFIG_OPENTHREAD_RADIO_SPINEL_UART=n
          CONFIG_AUTO_UPDATE_RCP=n
          CONFIG_OPENTHREAD_RCP_COMMAND=n
          EOF
          sed -i 's/esp_rcp_update_create_ota_image/#esp_rcp_update_create_ota_image/g' CMakeLists.txt || true
          sed -i 's/esp_rcp_update_create_ota_image/#esp_rcp_update_create_ota_image/g' main/CMakeLists.txt || true
          idf.py set-target esp32c6
          idf.py build
          esptool.py --chip esp32c6 merge_bin -o /__w/esp32c6-wifi-otbr.bin @build/flash_args

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32c6-wifi-otbr
          path: /__w/esp32c6-wifi-otbr.bin
