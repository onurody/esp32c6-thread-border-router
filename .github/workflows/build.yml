name: Build ESP32-C6 OTBR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.3
    steps:
      - name: Build ESP32-C6 Auto-WiFi OTBR
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cp -r /opt/esp/idf/examples/openthread/ot_br /tmp/ot_br
          cd /tmp/ot_br
          python3 -c 'p="main/esp_ot_br.c"; s=open(p).read(); h="#include \"driver/gpio.h\"\n#include \"esp_ot_wifi_cmd.h\"\n#include \"freertos/FreeRTOS.h\"\n#include \"freertos/task.h\"\nstatic void auto_wifi_task(void *pvParameters) { vTaskDelay(pdMS_TO_TICKS(5000)); esp_ot_wifi_connect(\"ONUR-YILDIZ\", \"5412000735\"); vTaskDelete(NULL); }\n"; s=h+s; init="app_main(void)\n{\n    gpio_set_direction(GPIO_NUM_3, GPIO_MODE_OUTPUT);\n    gpio_set_level(GPIO_NUM_3, 0);\n    gpio_set_direction(GPIO_NUM_14, GPIO_MODE_OUTPUT);\n    gpio_set_level(GPIO_NUM_14, 1);\n    xTaskCreate(auto_wifi_task, \"auto_wifi\", 4096, NULL, 5, NULL);"; s=s.replace("app_main(void)\n{", init, 1); open(p, "w").write(s)'
          cat << 'EOF' >> sdkconfig.defaults
          CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y
          CONFIG_ESP_CONSOLE_UART_DEFAULT=n
          CONFIG_OPENTHREAD_BR_AUTO_START=y
          CONFIG_OPENTHREAD_BR_REST_ENABLE=y
          CONFIG_OPENTHREAD_RADIO_NATIVE=y
          CONFIG_OPENTHREAD_RADIO_SPINEL_UART=n
          EOF
          idf.py set-target esp32c6
          idf.py build
          cd build
          esptool.py --chip esp32c6 merge_bin -o /__w/esp32c6-wifi-otbr.bin @flash_args

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32c6-wifi-otbr
          path: /__w/esp32c6-wifi-otbr.bin
